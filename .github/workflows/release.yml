name: Release
on:
  push: {tags: ['v*']}
permissions: {contents: write}
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: make test
      - name: Build ad-hoc-signed DMG
        env:
          VERSION: ${{ github.ref_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export VERSION="${VERSION#v}"
          export UV_BINARY="$(command -v uv)"
          make dmg
      - name: Verify privacy-safe signature
        run: |
          DMG="$(find .build -maxdepth 1 -name 'MLX-AI-*.dmg' -print -quit)"
          codesign --verify --deep --strict '.build/MLX AI.app'
          codesign -dvvv '.build/MLX AI.app' 2>&1 | grep 'Signature=adhoc'
          test -s "$DMG"
      - name: Publish GitHub Release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "${GITHUB_REF_NAME}" .build/MLX-AI-*.dmg \
            --verify-tag --generate-notes \
            --notes "This build is intentionally ad-hoc signed and contains no Developer ID or Apple account identity. On first launch, macOS may require right-clicking MLX AI and choosing Open, or approving it under Privacy & Security."
