name: Bug report
description: Report a reproducible MLX AI problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes: {label: Summary, description: "What happened and what did you expect?"}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: MLX AI version}
    validations: {required: true}
  - type: input
    id: macos
    attributes: {label: Mac and macOS version}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: diagnostics
    attributes: {label: Diagnostics, description: Paste Diagnostics output after removing private details.}
